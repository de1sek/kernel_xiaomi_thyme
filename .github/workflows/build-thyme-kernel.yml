name: Build Thyme Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev make python3 zip git \
            dwarves \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b alioth-r-oss \
            https://github.com/de1sek/Xiaomi_Kernel_OpenSource kernel
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" kernel/Makefile | head -3

      - name: Build kernel
        run: |
          cd kernel

          # Fix 1: 修复 Python 2 到 3 的包装器脚本（注意：EOF必须严格靠左）
          cat > scripts/gcc-wrapper.py << 'EOF'
#!/usr/bin/env python3
import sys, subprocess
sys.exit(subprocess.call(sys.argv[1:]))
EOF

          # Fix 2: 替代原本报错的 Python 脚本，用 sed 安全注入 GCC10+ 兼容参数
          echo ">>> 正在修复 DTC yylloc 编译器兼容问题 (HOSTCFLAGS)..."
          sed -i 's/^HOSTCFLAGS.*/& -fcommon -Wno-deprecated-declarations/' Makefile

          # 步骤 1: 生成固定的 thyme 用户版本配置文件
          echo ">>> 正在生成基础配置..."
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/thyme_user_defconfig

          # 步骤 2: 正式编译内核
          echo ">>> 正在编译内核内核核心 (Image.gz)..."
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-${{ github.run_number }}
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: error
