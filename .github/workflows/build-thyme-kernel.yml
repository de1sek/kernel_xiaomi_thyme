name: Build Thyme Kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Inject KernelSU Ultra + SUSFS'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev make python3 zip git \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b thirteen \
            https://github.com/de1sek/kernel_xiaomi_thyme kernel

      - name: Inject SukiSU Ultra + SUSFS + KPM
        if: github.event.inputs.kernelsu == 'true'
        env:
          PATCH_EXEC: |
            with open('fs/exec.c') as f:
                c = f.read()
            extern = "\n#ifdef CONFIG_KSU\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n"
            hook = "\n\t#ifdef CONFIG_KSU\n\tif (ksu_execveat_hook)\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\t#endif\n"
            if "ksu_handle_execveat" not in c:
                pos = c.find("int do_execveat_common(")
                if pos != -1:
                    c = c[:pos] + extern + c[pos:]
                pos_hook = c.find("if (IS_ERR(filename))")
                if pos_hook != -1:
                    c = c[:pos_hook] + hook + c[pos_hook:]
                with open('fs/exec.c', 'w') as f:
                    f.write(c)
                print(">>> fs/exec.c patched successfully")
          PATCH_OPEN: |
            with open('fs/open.c') as f:
                c = f.read()
            extern = "\n#ifdef CONFIG_KSU\nextern bool ksu_faccessat_hook __read_mostly;\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *flags);\n#endif\n"
            hook = "\n\t#ifdef CONFIG_KSU\n\tif (ksu_faccessat_hook)\n\t\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);\n\t#endif\n"
            if "ksu_handle_faccessat" not in c:
                pos = c.find("long do_faccessat(")
                if pos != -1:
                    c = c[:pos] + extern + c[pos:]
                pos_hook = c.find("if (IS_ERR(name))")
                if pos_hook != -1:
                    c = c[:pos_hook] + hook + c[pos_hook:]
                with open('fs/open.c', 'w') as f:
                    f.write(c)
                print(">>> fs/open.c patched successfully")
          PATCH_RW: |
            with open('fs/read_write.c') as f:
                c = f.read()
            extern = "\n#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr);\n#endif\n"
            hook = "\n\t#ifdef CONFIG_KSU\n\tif (ksu_vfs_read_hook)\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n\t#endif\n"
            if "ksu_handle_vfs_read" not in c:
                pos = c.find("ssize_t vfs_read(")
                if pos != -1:
                    c = c[:pos] + extern + c[pos:]
                pos_hook = c.find("if (!(file->f_mode & FMODE_READ))")
                if pos_hook != -1:
                    c = c[:pos_hook] + hook + c[pos_hook:]
                with open('fs/read_write.c', 'w') as f:
                    f.write(c)
                print(">>> fs/read_write.c patched successfully")
        run: |
          cd kernel

          # 1. 注入 SukiSU Ultra 驱动源码
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s main

          # 2. 克隆并应用 SUSFS 补丁
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          
          echo ">>> 正在应用 SUSFS 补丁..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          # 尝试应用补丁（忽略可能因魔改导致的 sched.h 冲突，后续靠手动挂载驱动）
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch || echo "警告: 部分补丁未完全匹配，将依赖后置Kconfig强制引入机制"

          # 3. 核心修复：强行在内核总 Kconfig 树中挂载驱动入口，防止配置项被 Kbuild 剔除
          echo ">>> 正在向核心 Kconfig 注册驱动..."
          if ! grep -q "kernelsu" drivers/Kconfig; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "susfs" fs/Kconfig; then
              sed -i '/endmenu/i source "fs/susfs/Kconfig"' fs/Kconfig
          fi

          # 4. 执行基于 Python 的源码动态插桩 (Manual Hook)
          echo ">>> 正在执行源码动态插桩..."
          if ! grep -q ksu_handle_execveat fs/exec.c; then
              echo "$PATCH_EXEC" > /tmp/patch_exec.py
              python3 /tmp/patch_exec.py
          fi

          if ! grep -q ksu_handle_faccessat fs/open.c; then
              echo "$PATCH_OPEN" > /tmp/patch_open.py
              python3 /tmp/patch_open.py
          fi

          if ! grep -q ksu_handle_vfs_read fs/read_write.c; then
              echo "$PATCH_RW" > /tmp/patch_rw.py
              python3 /tmp/patch_rw.py
          fi

          # 5. 写入 defconfig 配置项
          DEFCONFIG="arch/arm64/configs/thyme_defconfig"
          echo ">>> 正在向 defconfig 写入配置开关..."
          
          # 清除历史可能存在的冲突项
          sed -i '/CONFIG_KSU/d' $DEFCONFIG
          sed -i '/CONFIG_SUSFS/d' $DEFCONFIG
          sed -i '/CONFIG_KPM/d' $DEFCONFIG
          sed -i '/CONFIG_KALLSYMS/d' $DEFCONFIG

          # 写入全新、完整的驱动配置
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          
          # SUSFS 隐藏套件完整开关
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SMART_HIDE=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_HIDE_RENAME=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_HIDE_HEAPPROFD=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SUS_SU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          
      - name: Build kernel
        run: |
          cd kernel
          
          # 生成基础配置
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            thyme_defconfig

          # ======= 黄金排错线：强制在编译开始前检查配置是否留存 =======
          echo "=================================================="
          echo ">>> 正在安全检查：验证 KSU / SUSFS 是否被内核接纳 <<<"
          if grep -q "CONFIG_KSU=y" out/.config; then
              echo "✅ 成功：KernelSU 配置已生效！"
          else
              echo "❌ 失败：KernelSU 被编译系统无视删除了！请检查Kconfig引入！"
          fi
          if grep -q "CONFIG_SUSFS=y" out/.config; then
              echo "✅ 成功：SUSFS 配置已生效！"
          else
              echo "❌ 失败：SUSFS 被编译系统无视删除了！"
          fi
          echo "=================================================="

          # 正式开始编译
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-fixed
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: error
