name: Build Thyme Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            make zip git python3 python-is-python3 cpio dwarves \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            tzdata

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b alioth-r-oss \
            https://github.com/de1sek/kernel_xiaomi_sm8250 kernel
          
          echo "=== Kernel Version ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)" kernel/Makefile | head -5 || true

      - name: Apply fixes
        run: |
          cd kernel
          
          # GCC wrapper
          printf '#!/usr/bin/env python3\nimport sys, subprocess\nsys.exit(subprocess.call(sys.argv[1:]))\n' \
            > scripts/gcc-wrapper.py
          
          # qcom power supply fix
          find drivers/power/supply/qcom -name "*.c" | xargs \
            sed -i '1s/^/#ifndef HARDWARE_PLATFORM_SKULD\n#define HARDWARE_PLATFORM_SKULD 0\n#endif\n\n/'
          
          # === 关键修复：WALT is_top_app inline 问题 ===
          sed -i 's/extern inline bool is_top_app/static inline bool is_top_app/g' include/linux/sched.h || true
          sed -i 's/__always_inline/inline/g' kernel/sched/walt.h || true

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p out
          
          COMMON_KCFLAGS="-Wno-error=implicit-int -Wno-error=strict-prototypes \
                          -Wno-error=implicit-function-declaration -Wno-error=int-conversion \
                          -Wno-error=incompatible-pointer-types -Wno-error=unused-function \
                          -Wno-error=unused-variable -Wno-error=format \
                          -Wno-error=stringop-truncation -Wno-error=maybe-uninitialized \
                          -Wno-error=attributes \
                          -Wno-error=unused-const-variable -Wno-error=declaration-after-statement \
                          -Wno-error=frame-larger-than= -Wno-error=cast-function-type"
          
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$COMMON_KCFLAGS" \
            thyme_defconfig
          
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$COMMON_KCFLAGS" \
            Image.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-${{ github.run_number }}
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: error
