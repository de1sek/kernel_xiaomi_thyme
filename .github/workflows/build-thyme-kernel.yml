name: Build Thyme Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y bc bison flex libssl-dev libelf-dev libncurses-dev \
            make zip git python3 python-is-python3 cpio dwarves \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi tzdata

      - name: Clone kernel
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/de1sek/android_kernel_xiaomi_sm8250 kernel

      - name: Apply fixes
        run: |
          cd kernel
          # WALT scheduler fixes
          sed -i 's/extern inline bool is_top_app/static inline bool is_top_app/g' include/linux/sched.h || true
          sed -i 's/__always_inline/inline/g' kernel/sched/walt.h || true
          
          # qcom power supply fix
          find drivers/power/supply/qcom -name "*.c" | xargs \
            sed -i '1s/^/#ifndef HARDWARE_PLATFORM_SKULD\n#define HARDWARE_PLATFORM_SKULD 0\n#endif\n\n/'

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p out
          
          COMMON_KCFLAGS="-Wno-error -Wno-unused -Wno-format -Wno-maybe-uninitialized \
                          -Wno-unused-function -Wno-unused-variable -Wno-implicit-fallthrough \
                          -Wno-unused-but-set-variable -Wno-stringop-truncation \
                          -Wno-incompatible-pointer-types -Wno-declaration-after-statement \
                          -Wno-int-conversion -Wno-implicit-int -Wno-strict-prototypes"

          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$COMMON_KCFLAGS" \
            vendor/thyme_defconfig 2>&1 | tee defconfig.log

          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="$COMMON_KCFLAGS" \
            Image.gz 2>&1 | tee build.log || echo "=== BUILD FAILED ==="

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: thyme-kernel-${{ github.run_number }}
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel/*.log
