name: Build Thyme Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq && apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev make zip git \
            python3 python-is-python3 cpio dwarves gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi tzdata

      - name: Clone kernel
        run: |
          git clone --depth=1 -b lineage-18.1 https://github.com/de1sek/android_kernel_xiaomi_sm8250 kernel

      - name: Apply fixes
        run: |
          cd kernel
          # WALT 修复
          sed -i 's/extern inline bool is_top_app/static inline bool is_top_app/g' include/linux/sched.h || true
          sed -i 's/__always_inline/inline/g' kernel/sched/walt.h || true
          sed -i '/#include <linux/sched.h>/a #include "walt.h"' kernel/sched/fair.c || true
          
          # 更强的错误忽略
          sed -i 's/^KBUILD_CFLAGS.*/& -Wno-error -Wno-unused -Wno-format -Wno-maybe-uninitialized -Wno-unused-function/' Makefile || true

      - name: Build
        run: |
          cd kernel
          mkdir -p out
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            vendor/thyme_defconfig 2>&1 | tee defconfig.log

          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz 2>&1 | tee build.log || echo "=== BUILD FAILED ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/*.log
